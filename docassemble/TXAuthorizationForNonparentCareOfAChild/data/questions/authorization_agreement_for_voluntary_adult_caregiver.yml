id: Authorization_Agreement_for_Voluntary_Adult_Caregiver
continue button field: authorization_agreement_for_voluntary_adult_caregiver_intro
question: |
  ${ authorization_agreement_for_voluntary_adult_caregiver_attachment.title }
subquestion: |
  This form lets a parent in Texas give an adult who is not the child's parent
  temporary permission to make some decisions for the child.

  **Already have a court order or an open case involving the child?** Check the
  upcoming screens before you use this agreement. You may need written court approval.

  You may want to use this form if you are a parent who needs to leave your child with
  a relative or family friend for a while. The caregiver must be at least 18 years
  old. They do not have to be related to the child.

  The caregiver can do things like:

  * get medical care
  * enroll the child in school or daycare
  * apply for benefits.
  
  The caregiver **cannot**:

  * consent to an abortion
  * consent to emergency contraception.
  
  This form does **not** give custody. The agreement usually lasts six months
  at a time and renews automatically. You can set an earlier expiration date or
  revoke the agreement in writing.

  Everyone who must sign will sign in front of a notary. If only one parent signs,
  you usually must mail copies to the other parent within 10 days, unless an exception applies.
---
id: eligibility
need:
  - str(parent_authority_error)
question: |
  Before you start
subquestion: |
  Use this form only if **a parent** is giving permission to **an adult caregiver**
  (18 or older). The caregiver does not have to be related to the child.

  **Do not sign or use this agreement without written court approval when it is
  required.** This includes an existing order about custody, visitation, or child
  support. The next screen explains when you must stop and ask the court.
  If no parent can be found, a different process may be required.

  At least one parent and the caregiver must sign in front of a notary. If only one
  parent signs, you usually must mail copies to the other parent, unless an exception applies.

  This agreement does not change the child's immigration status.
fields:
  - "I am a parent with legal authority to sign this authorization agreement": eligibility_acknowledgement
    datatype: yesno
validation code: |
  if not eligibility_acknowledgement:
      validation_error(str(parent_authority_error))
---
code: |
  # This form is for one child and one caregiver
  caregivers.there_is_another = False
  users.there_are_any = True
  users.there_is_another = False
---
id: child_information
sets:
  - children[0].name.first
  - children[0].name.last
question: |
  Child's information
subquestion: |
  Enter the child's name and date of birth.
fields:
  - code: |
      children[0].name_fields()
  - "Child's date of birth": children[0].birthdate
    datatype: Birthdate
---
sets:
  - users[0].address.address
  - users[0].address.city
  - users[0].address.state
  - users[0].address.zip
id: parent_1_information
need:
  - str(parent_address_error)
continue button field: primary_parent_information
question: |
  Parent 1 information
subquestion: |
  Enter the information for the parent completing this form.
fields:
  - code: |
      users[0].name_fields()
  - code: |
      users[0].address_fields()
  - "Parent 1 phone number": users[0].phone_number
  - "Other contact information (optional)": users1_other_contact
    input type: area
    maxlength: 158
validation code: |
  if not users[0].address.address or not users[0].address.city or not users[0].address.state or not users[0].address.zip:
      validation_error(str(parent_address_error))
---
sets:
  - users[1].address.address
  - users[1].address.city
  - users[1].address.state
  - users[1].address.zip
id: other_parent_information
question: |
  Other parent information
subquestion: |
  If you know who the child's other parent is, enter their information.
  If they will sign, they must sign in front of a notary. If they do
  not sign, mail them copies within 10 days after signing, unless an exception applies.
  Answer Yes if you know who they are, even if you do not know where they live now.
  Enter their last known address if you know it. You can leave their address
  or phone number blank if you do not know it.
fields:
  - "Is the child's other parent known?": other_parent_known
    datatype: yesnoradio
  - "Will the other parent sign the agreement?": other_parent_will_sign
    datatype: yesnoradio
    show if: other_parent_known
  - code: |
      users[1].name_fields(show_if={"variable": "other_parent_known", "is": True})
  - code: |
      users[1].address_fields(
          show_if={"variable": "other_parent_known", "is": True},
          required={"address": False, "city": False, "state": False},
      )
  - "Other parent phone number": users[1].phone_number
    required: False
    show if: other_parent_known
  - "Other parent other contact information (optional)": users2_other_contact
    input type: area
    maxlength: 158
    show if: other_parent_known
---
id: caregiver_information
question: |
  Caregiver name and role
subquestion: |
  Enter the caregiver's name and choose their role.
sets:
  - caregivers[0].name.first
  - caregivers[0].name.last
  - caregivers[0].address.address
  - caregivers[0].address.city
  - caregivers[0].address.state
  - caregivers[0].address.zip
fields:
  - code: |
      caregivers[0].name_fields()
  - "Relationship to child": caregivers1_relationship_to_child
    input type: radio
    choices:
      - ${ adult_caregiver_label }: adult_caregiver
      - ${ pcsp_caregiver_label }: parental_child_safety_placement
        help: |
          Choose this option only if DFPS approved the caregiver in a Parental Child Safety Placement agreement during a DFPS investigation or services case.
  - code: |
      caregivers[0].address_fields()
  - "Caregiver phone number": caregivers[0].phone_number
  - "Other contact information (optional)": caregivers1_other_contact
    input type: area
    maxlength: 158
---
id: court_and_custody
need:
  - str(written_approval_error)
  - str(conflicting_claim_error)
question: |
  Court orders and other custody claims
subquestion: |
  **Check whether you need written court approval before you continue.** You need a written order approving this agreement from the appropriate court if any of these apply:

  - A court order or pending lawsuit affects the parent-child relationship. This can include an order about custody, visitation, or child support.
  - A court case about the child's custody, placement, possession, or visitation is pending.
  - A court has continuing, exclusive jurisdiction over the child, even if no case is pending now.

  If you need that approval and do not have it, **do not sign or use this agreement**. The agreement is void without the required order. Texas law makes it a Class B misdemeanor to knowingly present an invalid agreement as valid or knowingly make a false statement on the agreement.

  If another valid authorization agreement for this child is still in effect, a new agreement is void.

  [Get help asking the court for written approval](https://texaslawhelp.org/guide/i-need-court-approval-for-an-authorization-agreement-for-a-nonparent-adult-caregiver).
fields:
  - "As far as I know, there is no valid authorization agreement already in effect, and no other person or agency claims custody or control that conflicts with this agreement": no_other_custody_claimant
    datatype: yesno
  - "Court involvement status": child_court_involvement_status
    input type: radio
    choices:
      - ${ no_court_case_label }: no_court_case
      - ${ court_case_with_approval_label }: court_case_with_approval
      - ${ court_case_without_approval_label }: court_case_without_approval
validation code: |
  if child_court_involvement_status == "court_case_without_approval":
      validation_error(str(written_approval_error), field="child_court_involvement_status")
  if not no_other_custody_claimant:
      validation_error(str(conflicting_claim_error), field="no_other_custody_claimant")
---
id: agreement_term
question: |
  How long should the agreement last?
subquestion: |
  The agreement normally lasts six months from the date it is signed and
  automatically renews for another six months at a time. It can end sooner if
  you revoke it in writing or if a court enters certain orders about the child.
  To set an earlier expiration date, choose a date less than six months after signing.
fields:
  - "How long will the permission last?": agreement_term_choice
    input type: radio
    choices:
      - ${ six_month_agreement_label }: six_months
      - ${ earlier_expiration_label }: earlier_date
  - "Earlier expiration date": agreement_expiration_date
    datatype: date
    show if:
      variable: agreement_term_choice
      is: earlier_date
  - "If you want to end it earlier for specific reasons, list them here (optional)": agreement_early_termination_circumstances
    input type: area
    maxlength: 148
    required: False
    show if:
      variable: agreement_term_choice
      is: earlier_date
---
id: notary_instructions
need:
  - str(notary_acknowledgement_error)
question: |
  Notary required
subquestion: |
  Everyone who must sign must do it in front of a notary. Do **not** sign until
  you are with the notary.
fields:
  - "I understand I must sign in front of a notary": notary_instructions_acknowledgement
    datatype: yesno
validation code: |
  if not notary_instructions_acknowledgement:
      validation_error(str(notary_acknowledgement_error))
---
id: mailing_requirement
need:
  - str(mailing_acknowledgement_error)
question: |
  Mailing a copy to the other parent
subquestion: |
  If only one parent signs, you must mail a copy of the signed agreement to the
  other parent within **10 days**. Send one copy by **certified mail with return
  receipt requested** and another by **first-class mail** to their last known address. This
  applies if the other parent is living and still has parental rights. A limited
  exception may apply if that parent has no court-ordered possession or access
  and there is a qualifying protective order or criminal conviction. For an address
  outside the United States, send one copy by international registered mail with
  return receipt requested and one by international first-class mail. If you are required
  to send copies and do not mail them on time, the agreement is void.
fields:
  - "I understand the mailing requirement": mailing_requirement_acknowledgement
    datatype: yesnoradio
    show if:
      code: other_parent_known and (not other_parent_will_sign)
validation code: |
  if other_parent_known and (not other_parent_will_sign):
      if not mailing_requirement_acknowledgement:
          validation_error(str(mailing_acknowledgement_error))
---
id: preview authorization_agreement_for_voluntary_adult_caregiver
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign in front of a notary after printing.

  ${ al_court_bundle.as_pdf(key='preview') }

