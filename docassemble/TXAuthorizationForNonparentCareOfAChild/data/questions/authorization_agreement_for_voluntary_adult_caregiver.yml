  ${ action_button_html(url_action('review_authorization_agreement_for_voluntary_adult_caregiver'), label=str(edit_answers_label), color='info') }

  Return to this tab to continue.
continue button field: authorization_agreement_for_voluntary_adult_caregiver_preview_question
---
code: |
  signature_fields = ['users[0].signature', 'caregivers[0].signature']
  if other_parent_known and other_parent_will_sign:
      signature_fields.insert(1, 'users[1].signature')
---
code: |
